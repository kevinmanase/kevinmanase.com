<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Agents guiding agents loop architecture">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:700 30px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}.sub{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#94a3b8}.label{font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}.small{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cbd5e1}.tiny{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#94a3b8}.box{rx:14;stroke-width:2}.human{fill:#13233f;stroke:#60a5fa}.agent{fill:#063f36;stroke:#34d399}.gate{fill:#4c1d29;stroke:#fb7185}.state{fill:#312e81;stroke:#a78bfa}.prod{fill:#422006;stroke:#fbbf24}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.phone{fill:#0f172a;stroke:#64748b;stroke-width:2}.screen{fill:#020617;stroke:#334155;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#020617"/>
  <rect width="1200" height="720" fill="url(#grid)" opacity="0.8"/>

  <text x="70" y="70" class="title">agents guiding agents</text>
  <text x="70" y="98" class="sub">human intent becomes a governed loop: lanes, proof gates, durable state, approval</text>

  <path class="arrow" d="M 210 260 C 275 220, 330 212, 395 230"/>
  <path class="arrow" d="M 540 210 C 620 158, 702 158, 785 210"/>
  <path class="arrow" d="M 540 290 C 620 342, 702 342, 785 290"/>
  <path class="arrow" d="M 930 250 C 1010 250, 1038 318, 1048 380"/>
  <path class="arrow" d="M 980 485 C 858 572, 676 590, 510 555"/>
  <path class="arrow dash" d="M 390 505 C 315 500, 238 455, 203 380"/>

  <rect x="70" y="185" width="160" height="160" class="phone" rx="28"/>
  <rect x="90" y="218" width="120" height="88" class="screen" rx="8"/>
  <circle cx="150" cy="324" r="8" fill="#334155"/>
  <text x="150" y="245" class="label" text-anchor="middle">human</text>
  <text x="150" y="270" class="small" text-anchor="middle">operator</text>
  <text x="150" y="292" class="tiny" text-anchor="middle">often mobile</text>

  <rect x="390" y="170" width="180" height="90" class="box agent"/>
  <text x="480" y="205" class="label" text-anchor="middle">maker lane</text>
  <text x="480" y="231" class="small" text-anchor="middle">claude patches</text>

  <rect x="390" y="290" width="180" height="90" class="box agent"/>
  <text x="480" y="325" class="label" text-anchor="middle">ops lane</text>
  <text x="480" y="351" class="small" text-anchor="middle">codex scouts</text>

  <rect x="780" y="170" width="180" height="90" class="box gate"/>
  <text x="870" y="205" class="label" text-anchor="middle">checker</text>
  <text x="870" y="231" class="small" text-anchor="middle">tests / logs / api</text>

  <rect x="780" y="290" width="180" height="90" class="box state"/>
  <text x="870" y="325" class="label" text-anchor="middle">state sink</text>
  <text x="870" y="351" class="small" text-anchor="middle">linear / files</text>

  <rect x="970" y="405" width="150" height="90" class="box prod" filter="url(#glow)"/>
  <text x="1045" y="440" class="label" text-anchor="middle">approval</text>
  <text x="1045" y="466" class="small" text-anchor="middle">deploy / post</text>

  <rect x="360" y="490" width="190" height="90" class="box gate"/>
  <text x="455" y="525" class="label" text-anchor="middle">proof gate</text>
  <text x="455" y="551" class="small" text-anchor="middle">what did it prove?</text>

  <rect x="70" y="470" width="190" height="90" class="box state"/>
  <text x="165" y="505" class="label" text-anchor="middle">next loop</text>
  <text x="165" y="531" class="small" text-anchor="middle">lessons persist</text>

  <text x="70" y="650" class="tiny">unit of work: trigger → context → agent lane → independent checker → proof gate → durable state → human approval</text>
</svg>
